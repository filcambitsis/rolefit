services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rolefit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rolefit-local}
      POSTGRES_DB: rolefit
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rolefit"]
      interval: 5s
      retries: 10
  migrate:
    build: .
    command: alembic upgrade head
    environment: &api-env
      DATABASE_URL: postgresql+psycopg://rolefit:${POSTGRES_PASSWORD:-rolefit-local}@db:5432/rolefit
      APP_ENV: ${APP_ENV:-development}
      DEV_AUTH: ${DEV_AUTH:-false}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3002","http://127.0.0.1:3002"]}'
      SUPABASE_URL: ${SUPABASE_URL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BUDGET_USD: ${LLM_BUDGET_USD:-5}
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment: *api-env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  crawler:
    build: .
    command: python scripts/schedule.py
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    ports: ["127.0.0.1:3002:80"]
    depends_on: [api]
volumes:
  postgres:
