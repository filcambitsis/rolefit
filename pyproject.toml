[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "rolefit"
version = "0.1.0"
description = "Evidence-grounded job matching and reproducible ranking evaluation"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1", "pydantic-settings>=2.7,<3", "httpx>=0.28,<1", "PyJWT[crypto]>=2.10,<3", "python-multipart>=0.0.20", "pymupdf>=1.25,<2", "python-docx>=1.1,<2", "beautifulsoup4>=4.12,<5", "langdetect>=1.0.9", "rapidfuzz>=3.11,<4", "numpy>=2,<3", "scikit-learn>=1.6,<2", "typer>=0.15,<1"]
[project.optional-dependencies]
ml = ["sentence-transformers>=3.4,<6"]
dev = ["pytest>=8,<10", "ruff>=0.9", "pytest-cov>=6"]
[project.scripts]
rolefit = "rolefit.cli:app"
[tool.setuptools.packages.find]
where = ["api", "ml"]
[tool.pytest.ini_options]
pythonpath = ["api", "ml"]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
